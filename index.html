<title>Expense Manager</title>
<style>
:root{
  --paper:#F6F3EA; --card:#FFFFFF; --ink:#1C2B24; --mut:#6B7A72;
  --green:#123B2A; --green2:#1F7A4D; --gold:#C29B3C; --gold2:#E7CE8F;
  --red:#B3402A; --line:#E4DFD2; --chip:#EEF3EE;
  --r:14px; --sh:0 1px 3px rgba(20,40,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;padding-bottom:78px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
header.app{position:sticky;top:0;z-index:30;background:var(--green);color:#F4EDDA;padding:12px 14px calc(10px + env(safe-area-inset-top,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header.app .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C29B3C,#8A6A1E);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#123B2A;font-family:Georgia,serif}
header.app h1{font-size:15.5px;font-weight:700;letter-spacing:.6px;flex:1;font-family:Georgia,'Times New Roman',serif}
header.app .ver{font-size:10px;opacity:.75;display:block;letter-spacing:2px;font-family:-apple-system,sans-serif;font-weight:500}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#F4EDDA;border-radius:10px;padding:7px 11px;font-size:14px}
main{padding:12px;max-width:760px;margin:0 auto}
h2.sec{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px;font-weight:700}
/* passbook strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pass{min-width:150px;flex:0 0 auto;border-radius:16px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.pass::after{content:"";position:absolute;top:0;right:0;width:8px;height:100%;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.pass.cash{background:linear-gradient(135deg,#1F7A4D,#123B2A)}
.pass.bank{background:linear-gradient(135deg,#28527A,#152C44)}
.pass.cardp{background:linear-gradient(135deg,#7A2E2E,#3F1414)}
.pass .t{font-size:11px;opacity:.85;letter-spacing:.8px;text-transform:uppercase}
.pass .v{font-size:20px;font-weight:800;margin-top:4px}
.pass .s{font-size:11px;opacity:.8;margin-top:3px}
/* cards & rows */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .em{width:36px;height:36px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}

.item .sub{font-size:12px;color:var(--mut);margin-top:1px}
.amt{font-weight:800;font-size:15px}
.amt.in{color:var(--green2)} .amt.out{color:var(--red)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mut);font-weight:600}

.bigamt{font-size:26px;font-weight:800;text-align:center;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.gold.on{background:var(--gold);border-color:var(--gold);color:#26200f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--green);color:#fff;width:100%}

.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.red{background:var(--red)} .btn.gold{background:var(--gold);color:#26200f}
.btn:active{transform:scale(.985)}
.two{display:flex;gap:8px}.two>*{flex:1}
/* mic */

.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:999px}
.bar>i.over{background:var(--red)}
/* bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}

nav.bot button .i{font-size:20px}
nav.bot button.on{color:var(--green)}

  width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#1F7A4D,#123B2A);

<script src="cloud-config.js"></script>
<script>
/* Manifest and icons are real files next to this one — Chrome needs to fetch them by
   URL to install a proper app instead of a browser shortcut. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

/* ================= DATA ================= */
const LS='pb_khata_v1';
let DB=JSON.parse(localStorage.getItem(LS)||'null')||{
  cashOpen:0, banks:[], cards:[], budget:0, income:0,
  cats:[],

  inc:[],    // INCOME / inflow {id,date,amt,src,mode,note}
  liab:[],   // LIABILITIES {id,party,kind,amt,date,due,why,rate,note}  kind:'person'|'business'|'bank'|'other'
  repay:[],  // repayments against a liability {id,liabId,date,amt,mode,note}

  exps:[],   // {id,date,amt,cat,mode,note,aud,who}  mode:'cash'|bankId|cardId · who:'me'|'shop'
  led:[],    // {id,date,typ:'in'|'out',party,amt,mode,note,why,due,who}
  pays:[],   // card payments {id,date,cardId,from,amt}  from:'cash'|bankId
  tiles:[]   // one-tap shortcuts {id,nm,em,cat,who,note}
};
/* His real categories, in his words. Added by NAME so an existing install gains the
   missing ones without duplicating anything he already has or renamed. */
const WANT_CATS=[
  {nm:'Groceries',em:'🛒'},{nm:'Food & Dining',em:'🍽️'},{nm:'Utilities & Bills',em:'💡'},
  {nm:'Transport',em:'🚕'},{nm:'School Fees',em:'🎓'},{nm:'EMI & Loans',em:'🏦'},
  {nm:'Household',em:'🏠'},{nm:'Health',em:'💊'},{nm:'Family',em:'👨‍👩‍👦'},
  {nm:'Shopping',em:'🛍️'},{nm:'Shop — PARAMPARA',em:'🏪'},{nm:'Other',em:'📦'}];
/* Old name → new name. Renaming keeps the id, so nothing already recorded is orphaned. */
const RENAME={'ghar ka saman':'Groceries','khana-peena':'Food & Dining','bills & recharge':'Utilities & Bills',
  'mobile/net':'Utilities & Bills','cab / travel':'Transport','fuel/travel':'Transport',
  'school fee':'School Fees','emi / loan':'EMI & Loans','ghar':'Household','business':'Shop — PARAMPARA',
  'entertainment':'Food & Dining'};
const WANT_TILES=[
  {nm:'Groceries',em:'🛒',cat:'Groceries'},
  {nm:'Transport',em:'🚕',cat:'Transport'},
  {nm:'School fees',em:'🎓',cat:'School Fees'},
  {nm:'Bill payment',em:'💡',cat:'Utilities & Bills'},
  {nm:'Shop expense',em:'🏪',cat:'Shop — PARAMPARA',who:'shop'}];
function migrate(){
  DB.cats=DB.cats||[]; DB.tiles=DB.tiles||[]; DB.led=DB.led||[]; DB.exps=DB.exps||[];
  DB.liab=DB.liab||[]; DB.repay=DB.repay||[]; DB.pays=DB.pays||[]; DB.inc=DB.inc||[];
  // rename first, so the "do I already have it" check sees the new names
  DB.cats.forEach(c=>{ const nn=RENAME[String(c.nm).toLowerCase()];
    if(nn){ c.nm=nn; const w=WANT_CATS.find(x=>x.nm===nn); if(w)c.em=w.em; } });
  // a rename can create twins — fold the empty one into the one that has entries
  const seen={};
  DB.cats=DB.cats.filter(c=>{ const k=c.nm.toLowerCase();
    if(!seen[k]){ seen[k]=c; return true; }
    const keep=seen[k];
    DB.exps.forEach(e=>{ if(e.cat===c.id)e.cat=keep.id; });
    (DB.tiles||[]).forEach(t=>{ if(t.cat===c.id)t.cat=keep.id; });
    if(!keep.bud&&c.bud)keep.bud=c.bud;
    return false; });
  const have=n=>DB.cats.some(c=>c.nm.toLowerCase()===n.toLowerCase());
  WANT_CATS.forEach(c=>{ if(!have(c.nm))DB.cats.push({id:uid(),nm:c.nm,em:c.em,bud:0}); });
  if(!DB.tiles.length){
    WANT_TILES.forEach(t=>{ const c=DB.cats.find(x=>x.nm===t.cat);
      DB.tiles.push({id:uid(),nm:t.nm,em:t.em,cat:c?c.id:'',who:t.who||'me'}); });
  }
  DB.exps.forEach(e=>{ if(!e.who)e.who='me'; });
  DB.cardTx=DB.cardTx||[]; DB.trash=DB.trash||[]; DB.audit=DB.audit||[];
  DB.cards.forEach(c=>{c.emis=c.emis||[];c.emis.forEach(e=>{if(!e.id)e.id=uid()})});
  syncEmiPostings();
  S();
}
let _sWarned=false;
function S(){try{localStorage.setItem(LS,JSON.stringify(DB));try{cloudMark()}catch(e){}return true}
  catch(e){if(!_sWarned){_sWarned=true;try{toast('⚠️ Phone ki storage full hai — data save nahi hua. Abhi backup download karo.')}catch(_){}}return false}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>{const v=r2(n),neg=v<0,a=Math.abs(v),frac=Math.abs(a-Math.round(a))>0.004;
  return (neg?'-':'')+'₹'+(frac?a.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(a).toLocaleString('en-IN'))};
/* Amount hygiene: 2 decimals max, must be > 0 and sane. Returns 0 (and toasts) when not acceptable. */
const MAXAMT=1e9;
function amtOrToast(v){const raw=+v;if(!raw||raw<=0){toast('Rakam likho');return 0}
  const a=r2(raw);if(a<=0){toast('Rakam bahut chhoti hai');return 0}
  if(a>MAXAMT){toast('Rakam bahut badi hai — dobara check karo');return 0}return a}
/* Double-tap guard: the same save fired twice within 1.5s is ignored. */
let _lastSig='',_lastT=0;
function dupTap(sig){const n=Date.now();if(sig===_lastSig&&n-_lastT<1500)return true;_lastSig=sig;_lastT=n;return false}
const dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monthKey=d=>dateKey(d).slice(0,7);
const today=()=>dateKey(new Date());
const mkey=d=>(d||today()).slice(0,7);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlabel=k=>MN[+k.slice(5,7)-1]+' '+k.slice(0,4);
const dfmt=d=>{const x=new Date(d+'T00:00');return x.getDate()+' '+MN[x.getMonth()]};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){let t=document.getElementById('tst');if(!t){t=document.createElement('div');t.id='tst';t.style.cssText='position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#1C2B24;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88%';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}

/* ---- IndexedDB for voice notes ---- */
let idb;const idbReady=new Promise(res=>{const r=indexedDB.open('pb_khata_media',1);
r.onupgradeneeded=e=>e.target.result.createObjectStore('aud');
r.onsuccess=e=>{idb=e.target.result;res()};r.onerror=()=>res()});
function audPut(id,blob){return idbReady.then(()=>new Promise(r=>{if(!idb)return r();const t=idb.transaction('aud','readwrite');t.objectStore('aud').put(blob,id);t.oncomplete=r}))}
function audGet(id){return idbReady.then(()=>new Promise(r=>{if(!idb)return r(null);const q=idb.transaction('aud').objectStore('aud').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}))}
function audDel(id){return idbReady.then(()=>new Promise(r=>{if(!idb)return r();const t=idb.transaction('aud','readwrite');t.objectStore('aud').delete(id);t.oncomplete=r}))}

/* ================= BALANCES ================= */
function bankById(id){return DB.banks.find(b=>b.id===id)}
function cardById(id){return DB.cards.find(c=>c.id===id)}
function modeName(m){if(m==='cash')return'Cash';if(m==='accrued')return'Udhaar ke bakaye me joda';if(m==='loanfee')return'Loan se kata';if(m==='open')return'📖 Opening balance';const b=bankById(m);if(b)return b.nm;const c=cardById(m);if(c)return c.nm+' 💳';return m}
function accBal(id){ // 'cash' or bankId
  let v=id==='cash'?(+DB.cashOpen||0):(+((bankById(id)||{}).open)||0);
  DB.led.forEach(l=>{
    if(l.typ==='xfer'){                       // own money moving — one side out, other in
      if(l.from===id)v-=+l.amt;
      if(l.to===id)v+=+l.amt;
      return;
    }
    if(l.mode===id)v+=l.typ==='in'?+l.amt:-l.amt});
  DB.exps.forEach(e=>{if(e.mode===id)v-=+e.amt});
  DB.pays.forEach(p=>{if(p.from===id)v-=+p.amt});
  (DB.repay||[]).forEach(r=>{if(r.mode===id)v-=+r.amt});   // udhaar chukaya — paisa gaya
  (DB.inc||[]).forEach(x=>{if(x.mode===id)v+=+x.amt});     // aamdani — paisa aaya
  return v}
function monthSpend(mk){return DB.exps.filter(e=>mkey(e.date)===mk).reduce((s,e)=>s+ +e.amt,0)}

/* ================= DEBT MATHS (v23) =================
   One loan = one record, even when several loans come from the same person.
   Loan outstanding = opening principal (or the original amount) + interest/fees booked onto
   the loan − principal repaid. Never clamped: a negative figure is an overpayment, and is
   shown as one (liabOver), so every rupee stays visible. */
const LMETHOD={none:'Byaaj nahi',simple:'Simple byaaj (informal)',reducing:'EMI — reducing balance',flat:'EMI — flat rate',io:'Sirf byaaj (principal end me)',bullet:'Ek saath (bullet)'};
const EMETHOD={nocost:'No-cost (0%)',reducing:'Reducing balance (bank wala)',flat:'Flat rate',unknown:'Pata nahi'};
const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return dateKey(d)};
const dayAfter=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+1);return dateKey(d)};
function addMonths(s,n){const y=+s.slice(0,4),m=+s.slice(5,7)-1+n,day=+(s.slice(8,10)||1);
  const last=new Date(y,m+1,0).getDate();return dateKey(new Date(y,m,Math.min(day,last)))}
function monthsBetween(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))}
function catId(nm,em){let c=DB.cats.find(x=>x.nm===nm);if(!c){c={id:uid(),nm,em:em||'📦',bud:0};DB.cats.push(c)}return c.id}
const isSysMode=m=>m==='accrued'||m==='loanfee';

/* ---- loans ---- */
function hasOpen(l){return l.openOut!==undefined&&l.openOut!==null&&l.openOut!==''}
function liabEff(l){return hasOpen(l)?(l.openDate||l.date):l.date}
function liabBase(l){return hasOpen(l)?(+l.openOut||0):(+l.amt||0)}
function liabRepays(l,cutoff){return DB.repay.filter(r=>r.liabId===l.id&&(!hasOpen(l)||!l.openDate||r.date>=l.openDate)&&(!cutoff||r.date<cutoff))}
function liabAccr(l,cutoff){return DB.exps.filter(e=>e.liabId===l.id&&e.mode==='accrued'&&(!cutoff||e.date<cutoff))}
function liabPaid(id){const l=DB.liab.find(x=>x.id===id);return l?r2(liabRepays(l).reduce((s,r)=>s+ +r.amt,0)):0}
function liabBooked(l,cutoff){return r2(liabAccr(l,cutoff).reduce((s,e)=>s+ +e.amt,0))}
function liabOutRaw(l){return r2(liabBase(l)+liabBooked(l)-liabPaid(l.id))}
function liabOut(l){return Math.max(0,liabOutRaw(l))}
function liabOver(l){return Math.max(0,-liabOutRaw(l))}
function liabOutAsOf(l,cutoff){const eff=liabEff(l);if(eff&&eff>=cutoff)return 0;
  return r2(liabBase(l)+liabBooked(l,cutoff)-liabRepays(l,cutoff).reduce((a,r)=>a+(+r.amt||0),0))}
function liabIsNew(l){return l.isNew===true||DB.inc.some(x=>x.linkedLiabId===l.id)}
function liabOpen(){return DB.liab.filter(l=>liabOut(l)>0.5)}
/* Total debt = loans + cards (billed + EMI principal not yet billed) + Len-den payables.
   Receivables (Len-den + overpaid loans) are shown separately, never netted off. */
function liabTotals(){
  const t={person:0,business:0,bank:0,other:0,card:0,ledger:0,total:0,orig:0,paid:0,byaaj:0,late:0,over:0,recv:0,dup:[]};
  liabOpen().forEach(l=>{const k=t[l.kind]!==undefined&&['person','business','bank','other'].includes(l.kind)?l.kind:'other';t[k]+=liabOut(l);if(l.due&&l.due<today())t.late++});
  DB.liab.forEach(l=>{t.byaaj+=liabAccrued(l);t.orig+=liabBase(l)+liabBooked(l);t.paid+=liabPaid(l.id);t.over+=liabOver(l)});
  t.card=DB.cards.reduce((s,c)=>s+cardLiab(c.id),0);
  const lb=ledgerBal(); t.ledger=lb.pay; t.recv=r2(lb.recv+t.over);
  const lp=new Set(liabOpen().map(l=>(l.party||'').trim().toLowerCase()));
  t.dup=Object.keys(lb.m).filter(p=>lb.m[p]<-0.5&&lp.has(p.trim().toLowerCase()));
  ['person','business','bank','other','card','byaaj','orig','paid','over'].forEach(k=>t[k]=r2(t[k]));
  t.total=r2(t.person+t.business+t.bank+t.other+t.card+t.ledger);
  return t}
function mRate(l){const r=+l.rate||0;return (l.rateUnit==='y'?r/12:r)/100}
function rateTxt(l){return +l.rate?(+l.rate)+(l.rateUnit==='y'?'% / saal':'% / mahina'):''}
function emiFor(P,r,n){if(!(P>0)||!(n>0))return 0;if(!r)return r2(P/n);const f=Math.pow(1+r,n);return r2(P*r*f/(f-1))}
function amortize(P,r,n,emi,flat){const rows=[];let bal=r2(P);const E=+emi||emiFor(P,r,n);
  for(let k=1;k<=n;k++){const i=flat?r2(P*r):r2(bal*r);let p=flat?r2(P/n):r2(E-i);
    if(k===n||p>bal)p=bal; if(p<0)p=0; bal=r2(bal-p);rows.push({k,int:i,prin:p,bal})}
  return rows}
/* A schedule only exists when the terms are complete — otherwise nothing is invented. */
function loanSched(l){if(!['reducing','flat'].includes(l.method)||!(+l.tenure>0)||!(+l.amt>0)||!(+l.rate>0))return null;
  return amortize(+l.amt,mRate(l),+l.tenure,+l.emi||0,l.method==='flat')}
function loanIsEmi(l){return ['reducing','flat'].includes(l.method)&&+l.emi>0&&+l.tenure>0}
function loanEmiPaid(l){return (+l.paidBefore||0)+DB.repay.filter(r=>r.liabId===l.id&&r.emiK).length}
function loanEmiDue(l,d){if(!l.emiStart||!(+l.tenure>0)||d<l.emiStart)return 0;
  let n=monthsBetween(l.emiStart,d)+1; if(+d.slice(8,10)<+l.emiStart.slice(8,10))n--;
  return Math.max(0,Math.min(+l.tenure,n))}

/* Interest the lender has earned but that is not yet paid or booked. ALWAYS an estimate. */
function liabAccrued(l){
  const m=l.method||((+l.rate)?'simple':'none'); if(m==='none'||!(+l.rate))return 0;

    const due=loanEmiDue(l,end),paid=loanEmiPaid(l);
    return r2(s.slice(paid,Math.max(paid,due)).reduce((a,x)=>a+x.int,0))}
  const start=liabEff(l); if(!start||end<=start)return 0;
  const pays=liabRepays(l).filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  const r=mRate(l),days=(a,b)=>Math.max(0,(new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000);
  let p=liabBase(l),cur=start,int=0;

  int+=Math.max(0,p)*r*days(cur,end)/30.4375;

function ledgerBal(cutoff){const m={};
  DB.led.forEach(l=>{if(l.typ==='xfer'||!l.party||(cutoff&&l.date>=cutoff))return;m[l.party]=(m[l.party]||0)+(l.typ==='out'?+l.amt:-l.amt)});
  let pay=0,recv=0;Object.keys(m).forEach(k=>{const v=r2(m[k]);m[k]=v;if(v<0)pay-=v;else recv+=v});

/* ---- cards ---- */
function cardTxs(id,cutoff){return (DB.cardTx||[]).filter(t=>t.cardId===id&&(!cutoff||t.date<cutoff))}
function cardOpenIn(c,cutoff){return !cutoff||!c.openDate||c.openDate<cutoff}
function cardOut(id){const c=cardById(id);if(!c)return 0;let v=+c.open||0;
  DB.exps.forEach(e=>{if(e.mode===id)v+=+e.amt});
  DB.pays.forEach(p=>{if(p.cardId===id)v-=+p.amt});
  cardTxs(id).forEach(t=>v+=+t.amt);

function cardOutAsOf(id,cutoff){const c=cardById(id);if(!c)return 0;
  return r2((cardOpenIn(c,cutoff)?(+c.open||0):0)
    +DB.exps.filter(e=>e.mode===id&&e.date<cutoff).reduce((a,e)=>a+(+e.amt||0),0)
    -DB.pays.filter(p=>p.cardId===id&&p.date<cutoff).reduce((a,p)=>a+(+p.amt||0),0)

function emiTermsOk(e){return +e.principal>0&&+e.tot>0&&!!e.start&&e.method&&e.method!=='unknown'&&(e.method==='nocost'||+e.rate>0)}

function emiBillDate(c,e,k){const ym=addMonths(e.start+'-01',k-1).slice(0,7);
  const last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();

function emiBilledN(c,e,cutoff){if(!e.start||!(+e.tot>0))return 0;const cut=cutoff||tomorrow();let n=0;

function emiOut(c,e,cutoff){

    if(s&&e.lenderDate){const n0=emiBilledN(c,e,dayAfter(e.lenderDate)),n1=emiBilledN(c,e,cutoff);for(let k=n0+1;k<=n1;k++)v-=s[k-1].prin}

function syncEmiPostings(){
  DB.cardTx=DB.cardTx||[];const T=tomorrow(),want=new Map();let changed=false;
  DB.cards.forEach(c=>(c.emis||[]).forEach(e=>{const s=emiSched(e);if(!s||!e.id)return;
    const base=e.booked?'':(c.openDate||e.added||'');
    for(let k=1;k<=s.length;k++){const d=emiBillDate(c,e,k);if(d>=T)break;if(!e.booked&&base&&d<=base)continue;
      const key=e.id+':'+k,g=(+e.gst||0)/100,tag=e.nm+' EMI '+k+'/'+s.length;
      if(!e.booked)want.set('p|'+key,{coll:'cardTx',rec:{cardId:c.id,date:d,amt:s[k-1].prin,kind:'emi',note:tag+' principal'}});
      const it=r2(s[k-1].int*(1+g));
      if(it>0)want.set('i|'+key,{coll:'exps',rec:{date:d,amt:it,mode:c.id,cat:'IF',note:tag+' byaaj'+(g?' + GST':''),who:'me'}});
      if(k===1&&+e.fee>0)want.set('f|'+key,{coll:'exps',rec:{date:d,amt:r2(+e.fee*(1+g)),mode:c.id,cat:'IF',note:e.nm+' EMI processing fee'+(g?' + GST':''),who:'me',kind:'fee'}});
    }}));
  const have=new Map();
  DB.cardTx.forEach(t=>{if(t.autoKey)have.set(t.autoKey,{coll:'cardTx',rec:t})});

  have.forEach((h,k)=>{if(!want.has(k)&&h.rec.auto){DB[h.coll]=DB[h.coll].filter(x=>x!==h.rec);changed=true}});
  want.forEach((w,k)=>{const h=have.get(k);

    const rec={id:uid(),...w.rec,auto:true,autoKey:k};

function allocs(r,amt){if(Array.isArray(r.funds)&&r.funds.length)return r.funds.map(f=>({id:f.id,amt:+f.amt||0}));
  return r.fundId?[{id:r.fundId,amt:+amt||0}]:[]}

function fundUsage(lid){
  const u={expenses:0,repayments:0,cardBills:0,given:0,transfers:0,where:{}};
  const l=DB.liab.find(x=>x.id===lid),dep=DB.inc.find(x=>x.linkedLiabId===lid);
  const mv=(acc,a)=>{if(acc)u.where[acc]=(u.where[acc]||0)+a};
  if(dep)mv(dep.mode,+dep.amt||0);
  const use=(b,acc,a)=>{u[b]+=a;mv(acc,-a)};
  DB.exps.forEach(e=>{if(cardById(e.mode)||isSysMode(e.mode))return;allocs(e,e.amt).forEach(f=>{if(f.id===lid)use('expenses',e.mode,f.amt)})});
  DB.repay.forEach(r=>allocs(r,r.amt).forEach(f=>{if(f.id===lid)use('repayments',r.mode,f.amt)}));
  DB.pays.forEach(p=>allocs(p,p.amt).forEach(f=>{if(f.id===lid)use('cardBills',p.from,f.amt)}));
  DB.led.forEach(x=>allocs(x,x.amt).forEach(f=>{if(f.id!==lid)return;
    if(x.typ==='out')use('given',x.mode,f.amt);
    else if(x.typ==='xfer'){u.transfers+=f.amt;mv(x.from,-f.amt);mv(x.to,f.amt)}}));
  ['expenses','repayments','cardBills','given','transfers'].forEach(k=>u[k]=r2(u[k]));
  u.total=r2(u.expenses+u.repayments+u.cardBills+u.given);   // a transfer moves money, it does not use it
  u.received=dep?r2(+dep.amt):0; u.amt=l?r2(+l.amt||0):0; u.remaining=r2(u.amt-u.total);

  return u}

  const blanks=out.filter(x=>x.amt===null);

/* Everything already known to be leaving, in date order. */
function commitments(days){
  const T=new Date(today()+'T00:00'), out=[];
  const within=d=>{const x=Math.round((d-T)/86400000);return x>=0&&x<=days?x:null};
  const nextOn=day=>{ if(!day)return null;
    const d=new Date(T); d.setDate(day);
    if(d<T){d.setMonth(d.getMonth()+1);d.setDate(day);}
    return d};
  // credit card bills — the outstanding is what he will be asked for
  DB.cards.forEach(c=>{
    const due=nextOn(+c.dueDay); if(!due)return;
    const n=within(due); if(n===null)return;
    const amt=cardOut(c.id); if(amt<=0)return;
    out.push({d:n,date:dateKey(due),em:'💳',nm:c.nm+' bill',amt,kind:'card'});
  });
  // EMIs still running this month
  const mk=mkey();
  DB.cards.forEach(c=>emiActive(c,mk).forEach(e=>{
    const due=nextOn(+c.dueDay||5); const n=due?within(due):null; if(n===null)return;
    out.push({d:n,date:dateKey(due),em:'🏦',nm:e.nm+' EMI',amt:+e.mo||0,kind:'emi'});
  }));
  // money he promised to return, and money owed to him coming due
  DB.led.forEach(l=>{ if(l.typ==='xfer'||!l.due)return;
    const d=new Date(l.due+'T00:00'); const n=within(d);
    if(n===null&&d>=T)return;
    const late=d<T;
    out.push({d:late?-1:n,date:l.due,em:l.typ==='in'?'🔴':'🟢',
      nm:l.party+(l.why?' · '+l.why:''),amt:+l.amt,
      kind:l.typ==='in'?'pay':'get',late});
  });
  // written-down liabilities with a promised date
  (DB.liab||[]).forEach(l=>{ if(!l.due)return; const o=liabOut(l); if(o<=0.5)return;
    const d=new Date(l.due+'T00:00'); const nn=within(d);
    if(nn===null&&d>=T)return;
    const late=d<T;
    out.push({d:late?-1:nn,date:l.due,em:'💰',nm:l.party+(l.why?' · '+l.why:''),amt:o,kind:'pay',late});
  });
  // bills that repeat every month, if he has marked them
  (DB.tiles||[]).forEach(t=>{ if(!+t.rep)return;
    const due=nextOn(+t.rep); const n=due?within(due):null; if(n===null)return;
    out.push({d:n,date:dateKey(due),em:t.em,nm:t.nm,amt:+t.amt||0,kind:'bill',guess:!t.amt});
  });
  return out.sort((a,b)=>a.d-b.d)}

  const late=list.filter(x=>x.late).length;
  return `<div class="box" onclick="aheadView()" style="cursor:pointer;border-left:4px solid ${left<0?'var(--red)':'var(--green2)'}">

/* ---- voice recording (used by the expense entry form) ---- */
let mediaRec=null,recChunks=[];
async function toggleRec(){
  const mic=document.getElementById('e_mic');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];mediaRec=new MediaRecorder(st);
    mediaRec.ondataavailable=e=>recChunks.push(e.data);
    mediaRec.onstop=()=>{st.getTracks().forEach(t=>t.stop());
      if(EF)EF.aud=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      mic.classList.remove('rec');document.getElementById('e_recmsg').classList.add('hide');
      document.getElementById('e_hasaud').classList.remove('hide')};
    mediaRec.start();mic.classList.add('rec');
    document.getElementById('e_recmsg').classList.remove('hide');
    document.getElementById('e_hasaud').classList.add('hide');
  }catch(err){toast('Microphone permission denied')}}
function dropRec(){if(EF)EF.aud=null;document.getElementById('e_hasaud').classList.add('hide')}

function matchCat(s){s=(s||'').toLowerCase();
  let c=DB.cats.find(k=>k.nm.toLowerCase()===s)||DB.cats.find(k=>k.nm.toLowerCase().includes(s)||s.includes(k.nm.toLowerCase()));
  return c?c.id:(DB.cats.find(k=>/other/i.test(k.nm))||DB.cats[DB.cats.length-1]).id}
function matchMode(s){s=(s||'').toLowerCase();if(!s||/cash/.test(s))return'cash';
  let c=activeCards().find(x=>s.includes(x.nm.toLowerCase())||x.nm.toLowerCase().includes(s)||(x.last4&&s.includes(x.last4)));if(c)return c.id;
  let b=activeBanks().find(x=>s.includes(x.nm.toLowerCase())||x.nm.toLowerCase().includes(s)||(x.last4&&s.includes(x.last4)));if(b)return b.id;
  if(/card/.test(s)&&DB.cards[0])return DB.cards[0].id;

const PAY_RE=/payment\s*(received|recd|thank)|thank you for (your )?payment|payment credit|autopay credit/i;
const REFUND_RE=/refund|reversal|cashback|chargeback/i;
const EMI_RE=/\bemi\b|instal+ment/i;
const FEE_RE=/interest|finance charge|late (payment )?fee|annual fee|joining fee|processing fee|\bgst\b|igst|cgst|sgst|over ?limit|penal|service charge/i;
function parseImport(save){
  const t=document.getElementById('im_txt').value.trim();if(!t)return toast('Paste something first');
  let rows=[];
  try{const j=JSON.parse(t);if(Array.isArray(j))rows=j.map(r=>({d:r.d||r.date,a:+(r.a||r.amt||r.amount),c:r.c||r.cat||'',m:r.m||r.mode||'',n:r.n||r.note||''}))}catch(_){
    rows=t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[|,;]\s*/);
      return{d:p[0],a:+p[1],c:p[2]||'',m:p[3]||'',n:p[4]||''}})}
  rows=rows.filter(r=>r.d&&/^\d{4}-\d{2}-\d{2}/.test(r.d)&&Number.isFinite(r.a)&&r.a!==0&&Math.abs(r.a)<=MAXAMT);
  let paySkipped=0,refunds=0,emiSkipped=0;
  rows=rows.filter(r=>{r.n=String(r.n||'').trim();const txt=r.n+' '+r.c;
    if(PAY_RE.test(txt)){paySkipped++;return false}       // bill payments are recorded from the card screen, not as spends
    r.a=r2(r.a);
    if(EMI_RE.test(txt)&&!FEE_RE.test(r.n)){emiSkipped++;return false}   // EMI instalments come from the card's EMI details
    if(r.a<0||REFUND_RE.test(r.n)){r.a=-Math.abs(r.a);refunds++}
    else if(FEE_RE.test(r.n))r.fee=true;
    return r.a!==0});
  if(!rows.length)return document.getElementById('im_prev').innerHTML='<div class="empty">No valid lines found. Format: date | amount | category | paid-from | note'+(paySkipped?'<br>('+paySkipped+' payment line(s) skipped — record bill payments from the card screen)':'')+'</div>';
  // duplicates are counted: a genuine repeat purchase is kept, re-importing the same file adds nothing
  const have={};DB.exps.forEach(e=>{const k=e.date+'|'+r2(e.amt)+'|'+(e.note||'');(have[k]=have[k]||[]).push(e.id)});
  const used={},matched=new Set();let dup=0;const fresh=[];
  rows.forEach(r=>{const k=r.d.slice(0,10)+'|'+r.a+'|'+r.n;used[k]=(used[k]||0)+1;
    const h=have[k]||[];if(used[k]<=h.length){dup++;matched.add(h[used[k]-1])}else fresh.push(r)});
  if(!save){
    document.getElementById('im_prev').innerHTML=
    `<div class="box">${rows.slice(0,50).map(r=>{const cid=r.fee?catId('Interest & Fees','💸'):matchCat(r.c),c=DB.cats.find(x=>x.id===cid);
      return`<div class="mini" style="padding:3px 0">• ${dfmt(r.d.slice(0,10))} — <b>${fmt(r.a)}</b>${r.a<0?' (refund)':''} — ${c.em} ${esc(c.nm)} — ${esc(modeName(matchMode(r.m)))}${r.n?' — '+esc(r.n):''}</div>`}).join('')}</div>
    <div class="mini" style="margin:6px 0">${rows.length} entries found${dup?' · '+dup+' already in app (skipped)':''}${refunds?' · '+refunds+' refund(s)':''}${paySkipped?' · '+paySkipped+' bill-payment line(s) skipped':''}${emiSkipped?' · '+emiSkipped+' EMI line(s) skipped (card ki EMI details se judti hain)':''}</div>
    <button class="btn gold" onclick="parseImport(true)">✅ Save ${fresh.length} entries</button>`;
    return}
  const balRaw=parseFloat(String((document.getElementById('im_bal')||{}).value||'').replace(/,/g,''));
  if(dupTap('import|'+t.length+'|'+fresh.length+'|'+balRaw))return;
  const card=rows.map(r=>cardById(matchMode(r.m))).find(Boolean);
  fresh.forEach(r=>{const e={id:uid(),date:r.d.slice(0,10),amt:r.a,cat:r.fee?catId('Interest & Fees','💸'):matchCat(r.c),mode:matchMode(r.m),note:r.n,aud:false,who:'me'};
    DB.exps.push(e);matched.add(e.id)});
  auditLog('import','exps',{id:'import',amt:r2(fresh.reduce((s,r)=>s+r.a,0)),note:fresh.length+' lines imported'});
  S();
  if(balRaw>=0&&card&&String((document.getElementById('im_bal')||{}).value||'').trim()!==''){
    const ds=rows.map(r=>r.d.slice(0,10)).sort(),to=(document.getElementById('im_to')||{}).value||ds[ds.length-1];
    stmtRun(card.id,matched,{from:ds[0],to,bal:r2(balRaw),lines:rows.length+paySkipped+emiSkipped,dup,added:fresh.length,refunds,pay:paySkipped,emi:emiSkipped});
  }else{
    closeSheet();toast('✅ '+fresh.length+' entries imported'+(dup?' ('+dup+' already there)':''));
  }
  renderExp()}

/* ================= CASHFLOW =================
   Balance sirf ek number hai. Sawal ye hai: mahine bhar me kitna aaya, kitna gaya,
   aur farak kahan gaya. Card ka kharcha cash nahi nikalta — isliye alag rakha gaya hai. */
function cashOn(d){
  let v=(+DB.cashOpen||0)+DB.banks.reduce((s,b)=>s+(+b.open||0),0);
  const ok=x=>x.date<=d;
  (DB.inc||[]).filter(ok).forEach(x=>{if(isCashAcc(x.mode))v+=+x.amt});
  DB.exps.filter(ok).forEach(e=>{if(isCashAcc(e.mode))v-=+e.amt});
  (DB.repay||[]).filter(ok).forEach(r=>{if(isCashAcc(r.mode))v-=+r.amt});
  DB.pays.filter(ok).forEach(p=>{if(isCashAcc(p.from))v-=+p.amt});
  DB.led.filter(ok).forEach(l=>{ if(l.typ==='xfer'||!isCashAcc(l.mode))return;
    v+=l.typ==='in'?+l.amt:-l.amt});
  return v}
const mEnd=mk=>{const d=new Date(mk+'-01');d.setMonth(d.getMonth()+1);d.setDate(0);return dateKey(d)};
const mStartPrev=mk=>{const d=new Date(mk+'-01');d.setDate(0);return dateKey(d)};
function flowMonth(mk){
  const inM=x=>mkey(x.date)===mk;
  const f={inc:0,borrow:0,bySrc:{},exp:0,expCash:0,expCard:0,repaid:0,cardPaid:0,ledIn:0,ledOut:0};
  (DB.inc||[]).filter(inM).forEach(x=>{ if(!isCashAcc(x.mode))return;
    if(x.linkedLiabId||x.src==='Borrowed money'){f.borrow+=+x.amt;return}   // a loan is not income
    f.inc+=+x.amt; const k=x.src||'Other'; f.bySrc[k]=(f.bySrc[k]||0)+ +x.amt});
  DB.exps.filter(inM).forEach(e=>{f.exp+=+e.amt; if(isCashAcc(e.mode))f.expCash+=+e.amt; else if(cardById(e.mode))f.expCard+=+e.amt});
  (DB.repay||[]).filter(inM).forEach(r=>{if(isCashAcc(r.mode))f.repaid+=+r.amt});
  DB.pays.filter(inM).forEach(p=>{if(isCashAcc(p.from))f.cardPaid+=+p.amt});
  DB.led.filter(inM).forEach(l=>{ if(l.typ==='xfer'||!isCashAcc(l.mode))return;
    if(l.typ==='in')f.ledIn+=+l.amt; else f.ledOut+=+l.amt});
  f.in=f.inc+f.borrow+f.ledIn;      // cash actually received (reconciles with balances)
  f.out=f.expCash+f.repaid+f.cardPaid+f.ledOut;
  f.net=f.in-f.out;
  f.open=cashOn(mStartPrev(mk)); f.close=cashOn(mEnd(mk));
  f.rate=f.inc?Math.round((f.inc-f.out)/f.inc*100):0;   // savings rate on OWN income only
  return f}

/* ================= LIABILITIES — udhaar ka asli hisaab =================
   The ledger only ever knew *transactions*. But a liability is a standing fact:
   "Alok ko 50,000 dena hai." He must be able to write that down in ten seconds,
   without inventing a transaction, and it must stay on the screen until it is paid.
   Every repayment chips it down, so the app can always answer the only three
   questions that matter at 11pm: kisko, kitna, kisliye. */
const LKIND={person:{em:'👤',nm:'Log'},business:{em:'🏪',nm:'Business'},bank:{em:'🏦',nm:'Bank/Loan'},other:{em:'📄',nm:'Other'}};
/* Simple interest on what is still outstanding. Shown as its own line and never folded
   into the principal — so the big number on the screen is always one he can verify himself. */
/* Settlement order: interest bleeds daily, a broken promise costs the relationship.
   Those two decide the queue — not the size of the amount. */
function liabRank(){
  const T=new Date(today()+'T00:00');
  return liabOpen().map(l=>{
    const days=l.due?Math.round((new Date(l.due+'T00:00')-T)/86400000):null;
    const rate=+l.rate||0; let sc=rate*12;
    if(days!==null){ if(days<0)sc+=70+Math.min(40,-days); else if(days<=7)sc+=32; else if(days<=30)sc+=14; }
    return {l,days,rate,out:liabOut(l),sc}}).sort((a,b)=>b.sc-a.sc||b.out-a.out)}
let LP=[];
function liabParties(){
  const m={};
  liabOpen().forEach(l=>{const k=l.party||'—';
    if(!m[k])m[k]={nm:k,em:(LKIND[l.kind]||LKIND.person).em,out:0,n:0,whys:[],due:''};
    const o=m[k]; o.out+=liabOut(l); o.n++; if(l.why)o.whys.push(l.why);
    if(l.due&&(!o.due||l.due<o.due))o.due=l.due});
  LP=Object.values(m).sort((a,b)=>b.out-a.out);
  LP.forEach((p,i)=>{p.i=i;p.whys=[...new Set(p.whys)].join(', ')||'reason likha nahi';});
  return LP}
/* Income minus what the house actually eats — the only honest answer to
   "how much can I put on the debt this month". */
function capacity(){
  const mk=mkey();
  const real=(DB.inc||[]).filter(x=>mkey(x.date)===mk&&!x.linkedLiabId&&x.src!=='Borrowed money').reduce((s,x)=>s+ +x.amt,0);
  const inc=real||+DB.income||0;
  const ghar=DB.exps.filter(e=>mkey(e.date)===mk&&e.who!=='shop').reduce((s,e)=>s+ +e.amt,0);
  const shop=DB.exps.filter(e=>mkey(e.date)===mk&&e.who==='shop').reduce((s,e)=>s+ +e.amt,0);
  const paid=DB.repay.filter(r=>mkey(r.date)===mk).reduce((s,r)=>s+ +r.amt,0);
  return {inc,ghar,shop,paid,left:inc-ghar-paid}}

function dueTag2(d){
  const n=Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/86400000);
  if(n<0)return '<b style="color:var(--red)">'+(-n)+' din late</b>';
  if(n===0)return '<b style="color:var(--red)">aaj due</b>';
  if(n<=7)return '<b style="color:var(--gold)">'+n+' din baaki</b>';
  return 'due '+dfmt(d)}

function emiSuggest(){const P=+document.getElementById('q_amt').value,n=+document.getElementById('q_ten').value,r=+document.getElementById('q_rate').value;
  const u=document.getElementById('q_unit').value;if(!(P>0)||!(n>0)||!(r>0))return toast('Rakam, rate aur mahine teeno chahiye');
  const flat=document.getElementById('q_meth').value==='flat',mr=(u==='y'?r/12:r)/100;
  document.getElementById('q_emi').value=flat?r2(P/n+P*mr):emiFor(P,mr,n);toast('EMI bhar di — bank ke figure se mila lo')}
function saveLiab(id){
  const amt=amtOrToast(document.getElementById('q_amt').value);
  const party=document.getElementById('q_party').value.trim();
  if(!amt)return;
  if(!party)return toast('Naam likho — kisko dena hai');
  const g=k=>{const e=document.getElementById(k);return e?String(e.value).trim():''};
  const method=g('q_meth')||'none', rate=+g('q_rate')||0;
  const o={party,amt,kind:LQ.kind,why:g('q_why'),date:g('q_date')||today(),due:g('q_due'),
    rate,rateUnit:g('q_unit')==='y'?'y':'m',method:(method==='none'&&rate>0)?'simple':method,
    emi:g('q_emi')?r2(+g('q_emi')):'',tenure:g('q_ten')?Math.round(+g('q_ten')):'',emiStart:g('q_est'),paidBefore:g('q_pb')?Math.round(+g('q_pb')):'',
    openOut:g('q_oo')===''?'':r2(+g('q_oo')),openDate:g('q_od'),note:g('q_note')};
  if(['reducing','flat'].includes(o.method)&&(!(+o.emi>0)||!(+o.tenure>0)||!o.emiStart))
    return toast('EMI loan ke liye EMI ₹, kitne mahine aur pehli EMI ki tareekh — teeno likho');
  if(o.openOut!==''&&!(o.openOut>=0))return toast('Bakaya sahi likho');
  if(o.openOut!==''&&!o.openDate)o.openDate=today();
  const receiveMode=g('q_receive');
  if(receiveMode&&o.openOut!=='')return toast('Purana bakaya likha hai to "paisa abhi aaya" mat chuno — dono ek saath nahi');
  const disb=g('q_disb')===''?amt:r2(+g('q_disb'));
  if(receiveMode&&!(disb>0&&disb<=amt))return toast('Haath me aayi rakam 0 se zyada aur mool rakam se kam/barabar honi chahiye');
  if(dupTap('liab|'+(id||'new')+'|'+party+'|'+amt))return;
  let lid=id;
  if(id){const l=DB.liab.find(x=>x.id===id);const before={...l};
    Object.assign(l,o);
    if(liabOutRaw(l)<-0.5&&!confirm('Is badlav se '+fmt(liabOver(l))+' zyada chukaya dikhega (overpaid). Phir bhi save karein?')){Object.assign(l,before);return}
    auditLog('edit','liab',l,before);
  } else {lid=uid();const l={id:lid,...o};DB.liab.push(l);auditLog('add','liab',l)}
  const linked=DB.inc.find(x=>x.linkedLiabId===lid);
  const feeRec=DB.exps.find(x=>x.liabId===lid&&x.mode==='loanfee');
  if(receiveMode){
    if(linked){const b={...linked};linked.amt=disb;linked.date=o.date;linked.mode=receiveMode;linked.src='Borrowed money';linked.note='Loan received from '+party;auditLog('edit','inc',linked,b)}
    else {const x={id:uid(),date:o.date,amt:disb,src:'Borrowed money',mode:receiveMode,note:'Loan received from '+party,linkedLiabId:lid};DB.inc.push(x);auditLog('add','inc',x)}
    const fee=r2(amt-disb);
    if(fee>0.004){if(feeRec){feeRec.amt=fee;feeRec.date=o.date}else DB.exps.push({id:uid(),date:o.date,amt:fee,cat:catId('Interest & Fees','💸'),mode:'loanfee',liabId:lid,kind:'fee',who:'me',note:party+' loan processing fee (kat ke mila)'})}
    else if(feeRec)trashMove('Loan fee hata',[['exps',feeRec.id]]);
  }else{
    if(linked)trashMove('Loan ki deposit entry hatayi (account "kuch nahi" chuna)',[['inc',linked.id]]);
    if(feeRec)trashMove('Loan fee hata',[['exps',feeRec.id]]);
  }
  S();closeSheet();toast('✅ '+party+' — '+fmt(amt)+' likh liya');go('liab')}

/* Deleting a loan never destroys history: the loan, its payments, its deposit and the interest
   booked onto it go to the recycle bin together, and come back together. */
function delLiab(id){
  const l=DB.liab.find(x=>x.id===id); if(!l)return;
  const used=['exps','repay','pays','led'].some(c=>DB[c].some(x=>usesLoan(x,id)));
  if(used)return toast('Is udhaar ko kharchon ke source ke roop me link kiya gaya hai. Pehle un entries ka 🔗 source badlo.');
  const reps=DB.repay.filter(r=>r.liabId===id), dep=DB.inc.filter(x=>x.linkedLiabId===id),
    acc=DB.exps.filter(e=>e.liabId===id&&isSysMode(e.mode)), paidInt=DB.exps.filter(e=>e.liabId===id&&!isSysMode(e.mode));
  const msg='"'+l.party+' — '+fmt(l.amt)+'" hatayein?\n\n'+
    (reps.length?'• '+reps.length+' payment entry bhi hategi — jis account se di thi usme '+fmt(reps.reduce((s,r)=>s+ +r.amt,0))+' wapas judega.\n':'')+
    (dep.length?'• Jo '+fmt(dep[0].amt)+' '+modeName(dep[0].mode)+' me aaya tha wo entry bhi hategi — balance utna kam hoga.\n':'')+
    (acc.length?'• Bakaye me jode gaye byaaj/fee ('+acc.length+') bhi hatenge.\n':'')+
    (paidInt.length?'• Diya hua byaaj ('+paidInt.length+' entry) kharche me hi rahega.\n':'')+
    '\nSab kuch "Hataye gaye records" me rahega — wahan se wapas la sakte ho.';
  if(!confirm(msg))return;
  trashMove('Udhaar hataya: '+l.party+' '+fmt(l.amt),[['liab',id]].concat(reps.map(r=>['repay',r.id]),dep.map(x=>['inc',x.id]),acc.map(x=>['exps',x.id])));

function asOnRows(d){const cut=dayAfter(d);

  const cards=DB.cards.map(c=>({nm:c.nm,out:cardLiab(c.id,cut)})).filter(x=>Math.abs(x.out)>=0.5);

function whyChips(){const list=L.typ==='in'?WHYS_IN:WHYS_OUT;

function renderLed(){

/* A return date he set himself, surfaced on the day it matters. */
function dueSoonHTML(){
  const T=new Date(today()+'T00:00');
  const list=DB.led.filter(l=>l.due).map(l=>({l,d:Math.round((new Date(l.due+'T00:00')-T)/86400000)}))
    .filter(x=>x.d<=7).sort((a,b)=>a.d-b.d);
  if(!list.length)return '';
  return `<h2 class="sec">⏰ Yaad dilana hai</h2><div class="box">${list.map(x=>
    `<div class="item"><div class="em">${x.d<0?'🔴':'🟡'}</div>
     <div class="grow"><div class="nm">${esc(x.l.party)}${x.l.why?' · <span style="font-weight:500">'+esc(x.l.why)+'</span>':''}</div>
     <div class="sub">${x.d<0?(-x.d)+' din late':x.d===0?'aaj':x.d+' din baaki'} · ${x.l.typ==='out'?'aapko milna hai':'aapko dena hai'}</div></div>
     <div class="amt ${x.l.typ==='out'?'in':'out'} num">${fmt(x.l.amt)}</div></div>`).join('')}</div>`}
function partyBalances(){const m={};DB.led.forEach(l=>{
  if(l.typ==='xfer'||!l.party)return;         // a transfer is nobody's debt
  m[l.party]=(m[l.party]||0)+(l.typ==='out'?+l.amt:-l.amt)});return m}
function partyHTML(){const m=partyBalances();const ks=Object.keys(m).filter(p=>Math.round(m[p])!==0);
  if(!ks.length)return`<div class="empty">No open balances. Add a party name on IN/OUT entries (or an 📖 Opening balance) and the running balance will build here.</div>`;
  return ks.sort((a,b)=>Math.abs(m[b])-Math.abs(m[a])).map(p=>{const v=m[p];
   return`<div class="item" onclick="partyView('${esc(p).replace(/'/g,"\\'")}')" style="cursor:pointer"><div class="em">${v>0?'🟢':'🔴'}</div>
   <div class="grow"><div class="nm">${esc(p)}</div><div class="sub">${v>0?'To receive — Debtor':'To pay — Creditor'}</div></div>
   <span class="tag ${v>0?'get':'give'}">${fmt(Math.abs(v))}</span></div>`}).join('')}
function dueTag(l){ if(!l.due)return '';
  const d=Math.round((new Date(l.due+'T00:00')-new Date(today()+'T00:00'))/86400000);
  if(d<0)return ` · <b style="color:var(--red)">${-d}d late</b>`;
  if(d===0)return ` · <b style="color:var(--red)">due today</b>`;
  if(d<=7)return ` · <b style="color:var(--gold)">due in ${d}d</b>`;
  return ` · due ${dfmt(l.due)}` }
function partyView(p){const rows=DB.led.filter(l=>l.party===p).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const bal=partyBalances()[p]||0;
  openSheet(`<div class="xrow"><h3>🤝 ${esc(p)}</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box row between"><span>Net balance</span><span class="tag ${bal>0?'get':'give'}">${bal>0?'To receive ':'To pay '}${fmt(Math.abs(bal))}</span></div>
  <div class="box">${rows.map(l=>rowHTML(l.typ==='in'?'⬇️':'⬆️',
    (l.why||(l.typ==='in'?'Received':'Given'))+(l.note?' · <span style="font-weight:500">'+esc(l.note)+'</span>':''),
    dfmt(l.date)+' · '+modeName(l.mode)+dueTag(l),
    (l.typ==='in'?'+':'-')+fmt(l.amt),l.typ==='in'?'in':'out')).join('')}</div>
  <button class="btn ghost" style="margin-top:10px" onclick="waParty('${esc(p).replace(/'/g,"\\'")}')">💬 Send this account on WhatsApp</button>`)}
/* The account in plain words, so a disagreement is settled by showing it, not arguing. */
function waParty(p){
  const rows=DB.led.filter(l=>l.party===p).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  const bal=partyBalances()[p]||0;
  let t='*'+p+'* — hisaab\n\n';

  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
function ledListHTML(){const L2=[...DB.led].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,40);

function saveLed(){const amt=amtOrToast(document.getElementById('l_amt').value);

function delLed(id){if(!confirm('Ye entry hatayein?\n\n"Hataye gaye records" se wapas la sakte ho.'))return;trashMove('Len-den entry hatayi',[['led',id]]);S();renderLed()}


/* ================= ACCOUNT PAGE (bank, cash or card) =================
   Multiple banks and cards is the normal case, so each one needs its own page: what
   it holds today, every line that moved through it, a date range he chooses, and a
   printable statement. */
let AP={id:null,from:'',to:''};
function accIsCard(id){return !!cardById(id)}
function accTitle(id){ if(id==='cash')return '💵 Cash';
  const b=bankById(id); if(b)return '🏦 '+b.nm;
  const c=cardById(id); return c?'💳 '+c.nm:'—'}
/* Every line that touched this account, newest first. */
function accLines(id){
  const out=[];
  DB.exps.forEach(e=>{ if(e.mode!==id)return; const c=DB.cats.find(x=>x.id===e.cat)||{em:'📦',nm:'Other'};
    out.push({date:e.date,em:c.em,nm:c.nm+(e.note?' · '+e.note:''),sub:e.who==='shop'?'🏪 Shop':'Expense',amt:-e.amt}); });
  DB.led.forEach(l=>{
    if(l.typ==='xfer'){
      if(l.from===id)out.push({date:l.date,em:'🔄',nm:'Transfer to '+modeName(l.to),sub:l.note||'',amt:-l.amt});
      if(l.to===id)out.push({date:l.date,em:'🔄',nm:'Transfer from '+modeName(l.from),sub:l.note||'',amt:+l.amt});
      return; }
    if(l.mode!==id)return;
    out.push({date:l.date,em:l.typ==='in'?'⬇️':'⬆️',nm:(l.party||'—')+(l.why?' · '+l.why:''),
      sub:l.typ==='in'?'Received':'Given',amt:l.typ==='in'?+l.amt:-l.amt}); });
  (DB.inc||[]).forEach(x=>{ if(x.mode!==id)return;
    out.push({date:x.date,em:incEm(x.src),nm:x.src+(x.note?' · '+x.note:''),sub:'Aamdani',amt:+x.amt}); });
  (DB.repay||[]).forEach(r=>{ if(r.mode!==id)return; const l=DB.liab.find(y=>y.id===r.liabId)||{};
    out.push({date:r.date,em:'💰',nm:(l.party||'Udhaar')+' ko chukaya',sub:'Repayment',amt:-r.amt}); });
  DB.pays.forEach(pp=>{
    if(pp.from===id)out.push({date:pp.date,em:'💳',nm:'Card payment · '+((cardById(pp.cardId)||{}).nm||''),sub:'Paid out',amt:-pp.amt});
    if(pp.cardId===id)out.push({date:pp.date,em:'✅',nm:'Bill payment received',sub:'Reduces outstanding',amt:-pp.amt}); });
  return out.sort((a,b)=>b.date.localeCompare(a.date))}
function accPage(id){
  AP.id=id; if(!AP.from){const d=new Date();d.setMonth(d.getMonth()-1);AP.from=dateKey(d);AP.to=today();}
  renderAccPage()}
function renderAccPage(){
  const id=AP.id, card=accIsCard(id);
  const all=accLines(id);
  const rows=all.filter(r=>(!AP.from||r.date>=AP.from)&&(!AP.to||r.date<=AP.to));
  const inn=rows.filter(r=>r.amt>0).reduce((s,r)=>s+r.amt,0);
  const out=rows.filter(r=>r.amt<0).reduce((s,r)=>s-r.amt,0);
  openSheet(`<div class="xrow"><h3>${accTitle(id)}</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box">
    <div class="row between"><span>${card?'Outstanding (payable)':'Balance today'}</span>
      <b class="amt ${card?'out':'in'} num" style="font-size:20px">${fmt(card?cardOut(id):accBal(id))}</b></div>
    ${card?`<button class="btn gold" style="margin-top:10px" onclick="payForm('${id}')">💰 Record bill payment</button>
      <button class="btn ghost" style="margin-top:8px" onclick="cardForm('${id}')">✏️ Edit card / EMIs</button>`
    :(id==='cash'?`<button class="btn ghost" style="margin-top:10px" onclick="closeSheet();setMoney()">✏️ Edit opening balance</button>`
      :`<button class="btn ghost" style="margin-top:10px" onclick="closeSheet();setBanks()">✏️ Edit bank</button>`)}
  </div>
  ${accBreakdownHTML(id)}
  <h2 class="sec">Statement</h2>
  <div class="box">
    <div class="row" style="gap:8px">
      <div class="grow"><label class="f">FROM</label><input type="date" id="ap_from" value="${AP.from}" onchange="AP.from=this.value;renderAccPage()"></div>
      <div class="grow"><label class="f">TO</label><input type="date" id="ap_to" value="${AP.to}" onchange="AP.to=this.value;renderAccPage()"></div>
    </div>
    <div class="chips" style="margin-top:8px">
      <button class="chip" onclick="apRange(1)">1 month</button>
      <button class="chip" onclick="apRange(3)">3 months</button>
      <button class="chip" onclick="apRange(12)">1 year</button>
      <button class="chip" onclick="apRange(0)">All</button>
    </div>
    <div class="row between" style="margin-top:10px">
      <span class="pill">⬇️ In ${fmt(inn)}</span><span class="pill">⬆️ Out ${fmt(out)}</span>
      <span class="pill">${rows.length} entries</span>
    </div>
    <button class="btn ghost" style="margin-top:10px" onclick="accPrint()">📄 Download / print PDF</button>
  </div>
  <div class="box">${rows.length?rows.map(r=>
    `<div class="item"><div class="em">${r.em}</div><div class="grow">
      <div class="nm">${esc(r.nm)}</div><div class="sub">${dfmt(r.date)}${r.sub?' · '+esc(r.sub):''}</div></div>
     <div class="amt ${r.amt>0?'in':'out'} num">${r.amt>0?'+':'-'}${fmt(Math.abs(r.amt))}</div></div>`).join('')
    :`<div class="empty">Is period me koi entry nahi.</div>`}</div>`)}
/* Where the money on this account actually went, for the chosen dates. */
function accBreakdownHTML(id){
  const E=DB.exps.filter(e=>e.mode===id&&(!AP.from||e.date>=AP.from)&&(!AP.to||e.date<=AP.to));
  if(!E.length)return '';
  const tot=E.reduce((s,e)=>s+ +e.amt,0);
  const by={}; E.forEach(e=>{const k=e.cat||'_none';by[k]=(by[k]||0)+ +e.amt});
  const cats=DB.cats.map(c=>({c,v:by[c.id]||0})).concat(by._none?[{c:{em:'❓',nm:'Uncategorized'},v:by._none}]:[]).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const big=[...E].sort((a,b)=>b.amt-a.amt).slice(0,5);
  // small amounts that keep repeating are the ones nobody notices
  const cnt={}; E.forEach(e=>{const k=(e.note||'').trim().toLowerCase()||'(no note)';
    if(!cnt[k])cnt[k]={n:0,v:0,label:(e.note||'').trim()||'—'}; cnt[k].n++; cnt[k].v+=+e.amt;});
  const rep=Object.values(cnt).filter(x=>x.n>=3).sort((a,b)=>b.v-a.v).slice(0,3);
  return `<h2 class="sec">Paisa kahan gaya</h2>
  <div class="box">
    <div class="row between"><span class="mini">${E.length} spends in this period</span><b class="num">${fmt(tot)}</b></div>
    <div style="margin-top:10px">${cats.map(x=>`
      <div style="padding:6px 0">
        <div class="row between"><span>${x.c.em} ${esc(x.c.nm)}</span>
          <span class="num">${fmt(x.v)} <span class="mini">${Math.round(x.v/tot*100)}%</span></span></div>
        <div class="bar" style="height:6px;margin-top:4px"><i style="width:${Math.round(x.v/tot*100)}%"></i></div>
      </div>`).join('')}</div>
  </div>
  <h2 class="sec">Sabse bade kharche</h2>
  <div class="box">${big.map(e=>{const c=DB.cats.find(k=>k.id===e.cat)||{em:'📦',nm:'Other'};
    return `<div class="item" onclick="expForm('${e.id}','out')" style="cursor:pointer">
      <div class="em">${c.em}</div><div class="grow">
        <div class="nm">${esc(e.note||c.nm)}</div><div class="sub">${dfmt(e.date)} · ${esc(c.nm)}</div></div>
      <div class="amt out num">−${fmt(e.amt)}</div></div>`}).join('')}</div>
  ${rep.length?`<h2 class="sec">Baar-baar ho raha hai</h2>
  <div class="box"><div class="mini" style="padding:2px 2px 8px">Chhote kharche jo dohrate hain — yahin paisa chupke se nikal jaata hai.</div>

let RK=mkey();
/* ---- complete monthly debt reconciliation ----
   opening + new loans + old balances entered + EMI principal registered + card spends
   + interest/fees booked − principal repaid + lender refunds − card payments − card credits
   ± card adjustments ± Len-den payables  =  closing.  Any remainder is shown, never hidden. */
function monthBounds(mk){return{start:mk+'-01',end:mk===mkey()?tomorrow():dateKey(new Date(+mk.slice(0,4),+mk.slice(5,7),1))}}
function debtAt(cut){return r2(DB.liab.reduce((a,l)=>a+liabOutAsOf(l,cut),0)+DB.cards.reduce((a,c)=>a+cardLiab(c.id,cut),0)+ledgerBal(cut).pay)}
function debtRecon(mk){
  const {start,end}=monthBounds(mk),inM=x=>x.date>=start&&x.date<end;
  const R={mk,start,end,newLoans:0,oldBal:0,emiAdded:0,purchases:0,booked:0,principal:0,lenderRefund:0,payments:0,credits:0,cardAdj:0,ledger:0,shiftTagged:0};
  R.open=debtAt(start);R.close=debtAt(end);
  DB.liab.forEach(l=>{const eff=liabEff(l)||'';if(eff&&eff>=end)return;const fresh=!!eff&&eff>=start;
    if(fresh){if(liabIsNew(l))R.newLoans+=liabBase(l);else R.oldBal+=liabBase(l)}
    liabAccr(l).forEach(e=>{if(e.date<end&&(fresh||e.date>=start))R.booked+=+e.amt});
    liabRepays(l).forEach(r=>{if(r.date<end&&(fresh||r.date>=start)){if(+r.amt>=0)R.principal+=+r.amt;else R.lenderRefund+=-r.amt}})});
  DB.cards.forEach(c=>{
    if(c.openDate&&c.openDate>=start&&c.openDate<end)R.oldBal+=+c.open||0;
    DB.exps.forEach(e=>{if(e.mode===c.id&&inM(e)){if(+e.amt>=0)R.purchases+=+e.amt;else R.credits+=-e.amt}});
    DB.pays.forEach(p=>{if(p.cardId===c.id&&inM(p))R.payments+=+p.amt});
    let emiTx=0;(DB.cardTx||[]).forEach(t=>{if(t.cardId===c.id&&inM(t)){if(t.kind==='emi')emiTx+=+t.amt;else R.cardAdj+=+t.amt}});
    R.emiAdded+=cardUnbilled(c.id,end,false)-cardUnbilled(c.id,start,false)+emiTx});
  R.ledger=r2(ledgerBal(end).pay-ledgerBal(start).pay);
  const isLoan=id=>DB.liab.some(l=>l.id===id);
  DB.repay.filter(inM).forEach(r=>allocs(r,r.amt).forEach(f=>{if(isLoan(f.id))R.shiftTagged+=f.amt}));
  DB.pays.filter(inM).forEach(p=>allocs(p,p.amt).forEach(f=>{if(isLoan(f.id))R.shiftTagged+=f.amt}));
  Object.keys(R).forEach(k=>{if(typeof R[k]==='number')R[k]=r2(R[k])});
  R.calc=r2(R.open+R.newLoans+R.oldBal+R.emiAdded+R.purchases+R.booked-R.principal+R.lenderRefund-R.payments-R.credits+R.cardAdj+R.ledger);
  R.unexplained=r2(R.close-R.calc);
  const reduced=R.principal+R.payments;
  R.shiftPossible=r2(Math.max(0,Math.min(R.newLoans,reduced)-R.shiftTagged));
  R.over=DB.liab.filter(l=>liabOutAsOf(l,end)<-0.5).map(l=>({l,v:-liabOutAsOf(l,end)}));
  return R}

function prevKey(mk){const d=new Date(mk+'-01');d.setMonth(d.getMonth()-1);return monthKey(d)}
/* His question is not "what did I spend" — it is "kahan ZYADA kharch ho gaya".
   That is a comparison, so every line is this month against last month, biggest
   increase first. */
function moversHTML(mk){
  const pk=prevKey(mk);
  const sum=(k,cid)=>DB.exps.filter(e=>mkey(e.date)===k&&(e.cat||null)===cid).reduce((s,e)=>s+ +e.amt,0);
  const rows=DB.cats.concat([{id:null,nm:'Uncategorized',em:'❓'}]).map(c=>({c,now:sum(mk,c.id),was:sum(pk,c.id)}))
    .filter(r=>r.now||r.was).map(r=>({...r,d:r.now-r.was}))
    .sort((a,b)=>b.d-a.d);
  if(!rows.length)return '';
  const up=rows.filter(r=>r.d>0), down=rows.filter(r=>r.d<0);
  const line=r=>`<div class="item"><div class="em">${r.c.em}</div>
    <div class="grow"><div class="nm">${esc(r.c.nm)}</div>
      <div class="sub">${mlabel(pk)} ${fmt(r.was)} → ${mlabel(mk)} ${fmt(r.now)}</div></div>
    <div class="amt ${r.d>0?'out':'in'} num">${r.d>0?'+':'−'}${fmt(Math.abs(r.d))}</div></div>`;
  return `<h2 class="sec">Compared with ${mlabel(pk)}</h2>
  <div class="box">
    ${up.length?`<div class="mini" style="padding:4px 2px">Spent more</div>${up.slice(0,6).map(line).join('')}`:''}
    ${down.length?`<div class="mini" style="padding:8px 2px 4px;border-top:1px dashed var(--line)">Spent less</div>${down.slice(0,4).map(line).join('')}`:''}
  </div>`}
function insightsHTML(mk,sp,bud,cats,tr){
  const out=[];
  if(!sp)return`<div class="insight">Add entries for this month and the analysis will appear here.</div>`;
  const pk=prevKey(mk), prev=monthSpend(pk);
  // 1. where the money actually is
  if(cats[0])out.push(`Biggest head this month: <b>${cats[0].em} ${esc(cats[0].nm)}</b> — ${fmt(cats[0].v)}, ${Math.round(cats[0].v/sp*100)}% of everything you spent.`);
  // 2. the single line that answers "kahan zyada ho gaya"
  const sumC=(k,cid)=>DB.exps.filter(e=>mkey(e.date)===k&&e.cat===cid).reduce((s,e)=>s+ +e.amt,0);
  const movers=DB.cats.map(c=>({c,d:sumC(mk,c.id)-sumC(pk,c.id)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  if(prev&&movers[0])out.push(`Sabse zyada badha: <b>${esc(movers[0].c.nm)}</b> — ${fmt(movers[0].d)} more than ${mlabel(pk)}. ${movers[1]?'Then '+esc(movers[1].c.nm)+' (+'+fmt(movers[1].d)+').':''}`);
  // 3. budgets crossed
  const overs=cats.filter(c=>+c.bud&&c.v>+c.bud);
  if(overs.length)out.push(`⚠️ Over budget: ${overs.map(c=>`<b>${esc(c.nm)}</b> (+${fmt(c.v-c.bud)})`).join(', ')}.`);
  // 4. the one saving worth making
  if(cats[0]&&+cats[0].bud===0)out.push(`💡 <b>${esc(cats[0].nm)}</b> ka koi budget set nahi hai. Ek limit rakhoge toh cross hone par app turant batayegi.`);
  // 5. month against month
  if(prev){const dd=sp-prev;
    out.push(dd>0?`Overall <b>${fmt(dd)} more</b> than ${mlabel(pk)} (${fmt(prev)}).`
                 :`Overall <b>${fmt(-dd)} less</b> than ${mlabel(pk)} — well done. 👍`)}
  // 6. what a small cut is worth
  if(cats[0]&&cats[0].v>0){const cut=Math.round(cats[0].v*0.2/100)*100;
    if(cut>=100)out.push(`Agar sirf <b>${esc(cats[0].nm)}</b> me 20% kam karo toh mahine ke <b>${fmt(cut)}</b> bachenge — saal ka ${fmt(cut*12)}.`)}
  // 7. shop vs personal, only when it is real
  const L=DB.exps.filter(e=>mkey(e.date)===mk);
  const shop=L.filter(e=>e.who==='shop').reduce((s,e)=>s+ +e.amt,0);
  if(shop)out.push(`Isme ${fmt(shop)} shop ka hai — apna personal kharcha ${fmt(sp-shop)} hua.`);
  return out.map(t=>`<div class="insight">${t}</div>`).join('')}
function drawBars(id,data,vert,budLine){
  const cv=document.getElementById(id);if(!cv)return;
  const W=cv.clientWidth||320,H=170;cv.width=W*2;cv.height=H*2;cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(2,2);x.clearRect(0,0,W,H);
  if(!data.length||!data.some(d=>d.v>0)){x.fillStyle='#9aa8a0';x.font='13px sans-serif';x.textAlign='center';x.fillText('No data yet',W/2,H/2);return}
  const max=Math.max(...data.map(d=>d.v),budLine||0)*1.15;
  const n=data.length,gap=8,bw=Math.min(52,(W-20-gap*(n+1))/n);
  const x0=(W-(bw*n+gap*(n-1)))/2;
  data.forEach((d,i)=>{const h=max?d.v/max*(H-44):0;const bx=x0+i*(bw+gap),by=H-26-h;
    const g=x.createLinearGradient(0,by,0,H-26);
    g.addColorStop(0,d.hot?'#C29B3C':'#1F7A4D');g.addColorStop(1,d.hot?'#8A6A1E':'#123B2A');
    x.fillStyle=g;x.beginPath();
    if(x.roundRect)x.roundRect(bx,by,bw,h,[5,5,0,0]);else x.rect(bx,by,bw,h);
    x.fill();
    x.fillStyle='#1C2B24';x.font='600 10px sans-serif';x.textAlign='center';
    if(d.v)x.fillText((d.v>=1000?(d.v/1000).toFixed(d.v>=10000?0:1)+'k':Math.round(d.v)),bx+bw/2,by-5);
    x.fillStyle='#6B7A72';x.font='11px sans-serif';x.fillText(d.l,bx+bw/2,H-9)});
  if(budLine){const y=H-26-(budLine/max*(H-44));x.strokeStyle='#B3402A';x.setLineDash([5,4]);
    x.beginPath();x.moveTo(8,y);x.lineTo(W-8,y);x.stroke();x.setLineDash([]);
    x.fillStyle='#B3402A';x.font='600 10px sans-serif';x.textAlign='left';x.fillText('budget',10,y-4)}}

const b64=buf=>{let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encKey(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptJSON(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=250000;
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await encKey(pw,salt,iter),new TextEncoder().encode(JSON.stringify(obj)));
  return {fmt:'pb-khata-enc-1',kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function decryptJSON(env,pw){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},await encKey(pw,unb64(env.salt),+env.iter||250000),unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt))}

const DATE_RE=/^\d{4}-\d{2}-\d{2}/;
function validateBackup(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Backup must be a JSON object');
  const c=raw.db;
  if(!c||typeof c!=='object'||Array.isArray(c))throw new Error('Backup has no valid db object');
  const next={...c};
  ['cats','tiles','led','exps','liab','repay','pays','inc','banks','cards','cardTx','trash','audit'].forEach(k=>{
    if(next[k]===undefined||next[k]===null)next[k]=[];
    else if(!Array.isArray(next[k]))throw new Error(k+' must be a list');});
  const num=(v,what,neg)=>{const n=+v;
    if(v===''||v===null||v===undefined||typeof v==='boolean'||!Number.isFinite(n)||Math.abs(n)>1e12||(!neg&&n<0))throw new Error('Invalid '+what);return n};
  const opt=(v,what,neg)=>(v===undefined||v===null||v==='')?v:num(v,what,neg);
  const each=(list,name,fn)=>list.forEach((r,i)=>{
    if(!r||typeof r!=='object'||Array.isArray(r))throw new Error(name+' #'+(i+1)+' is not a record');
    if(!r.id)r.id=uid(); fn(r,name+' #'+(i+1))});
  const dated=(r,w)=>{if(typeof r.date!=='string'||!DATE_RE.test(r.date))throw new Error(w+': bad date')};
  each(next.cats,'category',(r,w)=>{if(typeof r.nm!=='string'||!r.nm)throw new Error(w+': no name')});
  each(next.exps,'expense',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount',true)});   // negative = card refund
  each(next.inc,'income',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount')});
  each(next.repay,'repayment',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount',true)});   // negative = lender refunded an overpayment
  each(next.cardTx,'card adjustment',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount',true)});
  const ids=new Set(next.liab.map(l=>l.id));
  next.repay.forEach((r,i)=>{if(!ids.has(r.liabId))throw new Error('repayment #'+(i+1)+': its loan is missing')});
  const cids=new Set(next.cards.map(c=>c.id));
  next.pays.forEach((p,i)=>{if(!cids.has(p.cardId))throw new Error('card payment #'+(i+1)+': its card is missing')});
  each(next.pays,'card payment',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount')});
  each(next.led,'ledger entry',(r,w)=>{dated(r,w);r.amt=num(r.amt,w+' amount')});
  each(next.liab,'liability',(r,w)=>{r.amt=num(r.amt,w+' amount');
    if(r.date&&!DATE_RE.test(r.date))throw new Error(w+': bad date'); r.rate=opt(r.rate,w+' rate')});
  each(next.banks,'bank',(r,w)=>{r.open=opt(r.open,w+' opening',true)});

/* ================= SHARED MESSAGE → EXPENSE =================
   A browser-based PWA cannot silently read the device SMS inbox or a Gmail inbox. This
   parser handles text explicitly shared/pasted by the user; all extracted transactions
   must be reviewed before saving (OTP texts are ignored; unclear direction is asked, never guessed;
   repeats are warned about). True background SMS capture requires a native Android
   app and is subject to Android/Google Play SMS permission policy. Gmail import requires
   explicit OAuth/API setup and narrowly scoped access; it is not enabled by this PWA. */
function parseTxn(raw){
  if(!raw)return null;
  const s=String(raw).replace(/\s+/g,' ').trim();
  const low=s.toLowerCase();
  if(/\botp\b|one[- ]?time password/i.test(s))return null;     // an OTP message is never a transaction

  // amount — first money-looking figure
  let m=low.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/);
  if(!m)m=low.match(/([\d,]+\.\d{2})\s*(?:rs\.?|inr|₹)/);
  if(!m)return null;
  const amt=+m[1].replace(/,/g,'');
  if(!amt||amt<=0)return null;

  // direction
  const out=/\b(debit(?:ed)?|spent|paid|withdrawn|purchase|sent|deducted)\b/.test(low);
  const inn=/\b(credit(?:ed)?|received|deposit(?:ed)?|refund(?:ed)?)\b/.test(low);
  const cardPay=/\bcard\b/.test(low)&&!/\b(spent|purchase|debited)\b/.test(low)&&
    /(payment|paid)\b[^.]{0,60}\b(received|credited|successful)|thank you for (your )?payment|payment[^.]{0,40}received/.test(low);
  // no clear keyword -> null: the user chooses, we never guess "money in"
  const refund=/\b(refund(?:ed)?|reversal|reversed|cashback|chargeback)\b/.test(low);
  const dir = cardPay?'cardpay':refund?'refund':(out&&!inn ? 'out' : (inn&&!out ? 'in' : (out&&inn?'out':null)));

  // last 4 digits of the account or card it went through
  let acc=null;
  let a=s.match(/(?:a\/c|acct|account|card|ac)\s*(?:no\.?)?\s*[:# ]*\s*(?:x+|\*+|X+)?\s*(\d{4})\b/i)
      || s.match(/(?:x{2,}|\*{2,})\s*(\d{4})\b/i);
  if(a)acc=a[1];

  // who it went to
  let who=null;
  let w=s.match(/\b(?:to\s+VPA|to\s+vpa)\s+([^\s,.;]+)/i)
     || s.match(/\bat\s+([A-Z0-9][A-Za-z0-9 &._-]{2,30}?)(?:\s+on\b|\s+for\b|[.,;]|$)/)
     || s.match(/\bto\s+([A-Z][A-Za-z0-9 &._-]{2,30}?)(?=\s+on\b|\s+\d{1,2}[-\/]\d|\s*[.,;]|$)/);
  if(w){ who=w[1].trim().replace(/@\w+$/,''); }
  if(who&&/^(your|a\/c|account|vpa)$/i.test(who))who=null;

  // date — dd-mm-yy(yy), dd/mm/yy, ddMonyy
  let date=null;
  let d=s.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})\b/);
  if(d){ let y=+d[3]; if(y<100)y+=2000; date=y+'-'+String(+d[2]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0'); }
  else{
    const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    d=s.match(/\b(\d{1,2})[- ]?([A-Za-z]{3})[- ]?(\d{2,4})\b/);
    if(d&&MON[d[2].toLowerCase()]){ let y=+d[3]; if(y<100)y+=2000;
      date=y+'-'+String(MON[d[2].toLowerCase()]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0'); }
  }
  const isCard=/\bcard\b/i.test(s);
  return {amt,dir,acc,who,date,isCard};
}

  return n}
/* Keep the newest 30 versions plus the newest one of each of the last 90 days. */
async function cloudPrune(){const rows=await cfetch('/rest/v1/snapshots?select=id,created_at&order=created_at.desc&limit=1000');if(!Array.isArray(rows))return;
  const keep=new Set(rows.slice(0,30).map(r=>r.id)),seen={},lim=new Date(Date.now()-90*86400000).toISOString();
  rows.forEach(r=>{const d=r.created_at.slice(0,10);if(!seen[d]&&r.created_at>=lim){seen[d]=1;keep.add(r.id)}});
  keep.add(cloudSt().lastId);
  const del=rows.filter(r=>!keep.has(r.id)).map(r=>r.id);
  for(let i=0;i<del.length;i+=40)await cfetch('/rest/v1/snapshots?id=in.('+del.slice(i,i+40).join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}})}
async function cloudVersions(){return await cfetch('/rest/v1/snapshots?select=id,created_at,device,rec_count,app_version&order=created_at.desc&limit=40')||[]}
/* Restore a cloud version: verified byte-for-byte, validated, with a local undo copy. */
async function cloudRestore(id){
  const rows=await cfetch('/rest/v1/snapshots?select=id,checksum,payload,created_at&id=eq.'+id);
  const row=Array.isArray(rows)&&rows[0];if(!row)throw new Error('version nahi mila');
  if(await sha256(row.payload)!==row.checksum)throw new Error('cloud copy kharab (checksum match nahi)');
  const parsed=validateBackup({db:JSON.parse(row.payload)});
  const previous=DB;try{localStorage.setItem(LS_PREV,JSON.stringify(previous))}catch(e){}
  _cloudApplying=true;
  try{DB=parsed.db;migrate();if(!S())throw new Error('storage')}
  catch(e){DB=previous;S();_cloudApplying=false;throw e}
  auditLog('restoreAll','cloud',{id:row.id,note:'cloud version '+row.created_at});S();
  _cloudApplying=false;clearTimeout(_cTimer);
  const st=cloudSt(),sum=await sha256(JSON.stringify(DB));
  st.lastId=row.id;st.lastSum=row.checksum;st.lastOkAt=row.created_at;st.conflict=null;st.pending=null;
  st.dirty=sum!==row.checksum;st.state=st.dirty?'pending':'synced';cloudSet(st);
  await cloudPullAudio().catch(()=>0);
  if(st.dirty)await cloudPush();   // the restore itself is recorded as a new version (audit line), base = the restored one
  return true}

/* ---- UI ---- */
const CSTATE={synced:['☁️✓','Synced'],pending:['☁️…','Pending — upload baaki'],syncing:['⟳','Sync ho raha hai'],offline:['📴','Offline — internet aate hi bhejega'],
  failed:['⚠️','Failed — dobara koshish hogi'],conflict:['⚔️','Conflict — chuno kaunsa rakhna hai'],login:['🔑','Login karo'],off:['☁️','Cloud backup band']};
function cloudStateNow(){const c=cloudCfg();if(!c.url||!c.key)return 'off';if(!cloudSess())return 'login';return cloudSt().state||'pending'}
function cloudLine(){const k=cloudStateNow(),st=cloudSt();return CSTATE[k][1]+(st.lastOkAt?' · aakhri backup '+fmtTime(st.lastOkAt):'')}
function fmtTime(iso){try{const d=new Date(iso);return dfmt(dateKey(d))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}catch(e){return iso}}
function cloudPaint(){const b=document.getElementById('cloudBtn');if(!b)return;const k=cloudStateNow();b.textContent=CSTATE[k][0];b.title=cloudLine();
  b.style.opacity=k==='off'?.55:1}
function cloudSheet(msg){const c=cloudCfg(),s=cloudSess(),st=cloudSt(),k=cloudStateNow();
  if(!c.url||!c.key)return openSheet(`<div class="xrow"><h3>☁️ Cloud backup — setup</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="mini" style="margin-bottom:8px">Apna free Supabase project banao (SETUP-CLOUD.md me steps). Wahan se <b>Project URL</b> aur <b>anon public key</b> yahan daalo. <b>service_role key kabhi mat daalna.</b></div>
    <label class="f">PROJECT URL</label><input id="cl_url" placeholder="https://xxxx.supabase.co" value="${esc(c.url)}">
    <label class="f">ANON PUBLIC KEY</label><input id="cl_key" placeholder="eyJ..." value="${esc(c.key)}">
    <button class="btn" style="margin-top:12px" onclick="cloudCfgSave()">💾 Save</button>
    <div class="mini" style="margin-top:8px">Ye dono GitHub par <b>cloud-config.js</b> me bhi likh sakte ho — tab Chrome data clear hone ke baad dobara nahi daalne padenge.</div>`);
  if(!s)return openSheet(`<div class="xrow"><h3>☁️ Cloud backup — login</h3><button class="x" onclick="closeSheet()">✕</button></div>
    ${msg?`<div class="box mini">${msg}</div>`:''}
    <label class="f">EMAIL</label><input id="cl_em" type="email" autocomplete="username">
    <label class="f">PASSWORD</label><input id="cl_pw" type="password" autocomplete="current-password">
    <div class="two" style="margin-top:12px"><button class="btn" onclick="cloudLoginUI(false)">🔑 Login</button><button class="btn ghost" onclick="cloudLoginUI(true)">➕ Naya account</button></div>
    <button class="btn sm ghost" style="margin-top:8px" onclick="cloudForgot()">Password bhool gaye?</button>
    <div class="mini" style="margin-top:8px">Password sirf app me likho — kisi chat ya message me kabhi nahi. Ye Supabase ke login ke liye hai.</div>
    <button class="btn sm ghost" style="margin-top:10px" onclick="cloudCfgReset()">Setup badlo</button>`);
  const cf=st.conflict;
  openSheet(`<div class="xrow"><h3>☁️ Cloud backup</h3><button class="x" onclick="closeSheet()">✕</button></div>
  ${msg?`<div class="box mini">${msg}</div>`:''}
  <div class="box"><div class="row between"><b>${CSTATE[k][0]} ${CSTATE[k][1]}</b></div>
    <div class="mini" style="margin-top:4px">Aakhri safal backup: <b>${st.lastOkAt?fmtTime(st.lastOkAt):'abhi tak nahi'}</b></div>
    <div class="mini">Account: ${esc((s.user&&s.user.email)||'')}</div>
    ${st.err&&k!=='synced'?`<div class="mini" style="color:var(--red)">Problem: ${esc(st.err)}</div>`:''}
    ${st.audErr?`<div class="mini" style="color:var(--gold)">Voice notes upload: ${esc(st.audErr)}</div>`:''}</div>
  ${k==='conflict'&&cf?`<div class="box" style="background:#FFF7E0"><b>⚔️ Cloud me doosra version hai</b>
    <div class="mini" style="margin:4px 0 8px">Cloud version: ${fmtTime(cf.at)} · ${cf.rec} records${cf.device===deviceId()?'':' · doosre device/browser se'}. Is phone par: ${recCount()} records.${cf.mine==='empty'?' Ye phone khaali hai — cloud wala laana sahi rahega.':''}</div>
    <button class="btn" onclick="cloudRestoreUI('${cf.id}')">☁️ Cloud wala lao (is phone ka data replace)</button>
    <button class="btn ghost" style="margin-top:8px" onclick="cloudForceUI()">📱 Is phone wala rakho (cloud par naya version)</button>
    <div class="mini" style="margin-top:6px">Jo bhi chuno, doosra version cloud history me rehta hai — kuch delete nahi hota.</div></div>`:''}
  <button class="btn" style="margin-top:8px" onclick="cloudPushUI()">⟳ Abhi backup karo</button>
  <button class="btn ghost" style="margin-top:8px" onclick="cloudVersionsUI()">🕘 Purane versions / restore</button>
  <div class="two" style="margin-top:8px"><button class="btn ghost" onclick="cloudSignOut().then(()=>cloudSheet())">Logout</button><button class="btn ghost" onclick="cloudCfgReset()">Setup badlo</button></div>
  <div class="mini" style="margin-top:8px">Har badlav ke 4 second baad poora data cloud me jata hai. Chrome data clear ho jaye ya phone badle — app kholo, login karo, "Cloud wala lao".</div>`)}
function cloudCfgSave(){const url=document.getElementById('cl_url').value.trim().replace(/\/+$/,''),key=document.getElementById('cl_key').value.trim();
  if(!/^https:\/\/[a-z0-9.-]+$/i.test(url))return toast('Project URL https://xxxx.supabase.co jaisa hona chahiye');
  if(key.length<30)return toast('anon public key poori paste karo');
  if(/^sb_secret_/.test(key)||/service_role/.test(atobSafe(key.split('.')[1]||'')))return toast('Ye SECRET key hai — ise app me kabhi mat daalo. Publishable / anon public key do.');
  lsSet(CLS+'_cfg',{url,key});cloudSheet()}
function atobSafe(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');return atob(s+'='.repeat((4-s.length%4)%4))}catch(e){return ''}}
function cloudCfgReset(){if(!confirm('Cloud setup hatayein? (Data aur cloud backup dono surakshit rahenge)'))return;lsSet(CLS+'_cfg',null);setSess(null);cloudSheet()}
async function cloudLoginUI(isNew){const em=document.getElementById('cl_em').value.trim(),pw=document.getElementById('cl_pw').value;
  if(!/^\S+@\S+\.\S+$/.test(em))return toast('Email sahi likho');if(pw.length<8)return toast('Password kam se kam 8 akshar');
  toast('⟳ ...');
  try{if(isNew){const r=await cloudSignUp(em,pw);if(r==='confirm')return cloudSheet('📧 '+esc(em)+' par confirm link gaya hai. Link kholo, phir yahan Login karo.')}
    else await cloudSignIn(em,pw);
    const st=cloudSt();st.state='pending';cloudSet(st);await cloudPush();cloudSheet()}
  catch(e){cloudSheet('⚠️ '+esc(String(e.message).replace(/^http \d+: /,'').slice(0,140)))}}
async function cloudForgot(){const em=(document.getElementById('cl_em')||{}).value||'';if(!/^\S+@\S+\.\S+$/.test(em.trim()))return toast('Pehle email likho');
  try{await cfetch('/auth/v1/recover',{method:'POST',body:JSON.stringify({email:em.trim()})},false);cloudSheet('📧 Password badalne ka link '+esc(em.trim())+' par bheja. Link isi phone par kholo.')}catch(e){cloudSheet('⚠️ '+esc(String(e.message)))}}
/* Links from Supabase emails (confirm sign-up / reset password) come back as #access_token=… */
async function handleAuthHash(){let h='';try{h=location.hash||''}catch(e){}if(!/access_token=/.test(h))return false;
  const q=new URLSearchParams(h.slice(1));try{history.replaceState(null,'',location.pathname)}catch(e){}
  const sess={access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_at:+q.get('expires_at')||Math.floor(Date.now()/1000)+(+q.get('expires_in')||3600),user:{}};
  setSess(sess);
  try{const u=await cfetch('/auth/v1/user');sess.user={id:u.id,email:u.email};setSess(sess)}catch(e){setSess(null);toast('Link purana ho gaya — dobara bhejo');return true}
  if(q.get('type')==='recovery')openSheet(`<div class="xrow"><h3>🔑 Naya password</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <input id="cl_np" type="password" autocomplete="new-password" placeholder="kam se kam 8 akshar"><button class="btn" style="margin-top:12px" onclick="cloudSetPw()">💾 Save</button>`);
  else{toast('✅ Email confirm — login ho gaya');cloudCheck()}
  return true}
async function cloudSetPw(){const pw=document.getElementById('cl_np').value;if(pw.length<8)return toast('Password kam se kam 8 akshar');
  try{await cfetch('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})});toast('✅ Password badal gaya');cloudSheet()}catch(e){toast('⚠️ '+String(e.message).slice(0,80))}}
async function cloudPushUI(){await cloudPush();cloudSheet()}
async function cloudForceUI(){if(!confirm('Is phone ka data cloud par naya version banega. Cloud wala purana version history me rahega. Theek?'))return;await cloudPush(true);cloudSheet()}
async function cloudRestoreUI(id){if(!confirm('Is phone ka abhi ka data us cloud version se badal jayega. Abhi wala ek copy me rahega (Undo restore). Theek?'))return;
  try{await cloudRestore(id);toast('✅ Cloud se data aa gaya');closeSheet();go('home')}catch(e){cloudSheet('⚠️ Restore nahi hua — '+esc(String(e.message))+'. Is phone ka data nahi badla.')}}
async function cloudVersionsUI(){let V=[];try{V=await cloudVersions()}catch(e){return cloudSheet('⚠️ '+esc(String(e.message)))}
  openSheet(`<div class="xrow"><h3>🕘 Cloud versions</h3><button class="x" onclick="cloudSheet()">‹</button></div>
  <div class="box">${V.length?V.map(v=>`<div class="item"><div class="grow"><div class="nm">${fmtTime(v.created_at)}</div><div class="sub">${v.rec_count} records · ${v.device===deviceId()?'ye phone':'doosra device'} · ${esc(v.app_version||'')}</div></div>
    <button class="btn sm ghost" onclick="cloudRestoreUI('${v.id}')">Restore</button></div>`).join(''):'<div class="empty">Cloud me abhi koi backup nahi.</div>'}</div>`)}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',()=>{const st=cloudSt();if(st.dirty||st.state==='offline'||st.state==='failed')cloudPush()});
  window.addEventListener('offline',()=>{const st=cloudSt();if(cloudSess()){st.state='offline';cloudSet(st);cloudPaint()}});
}
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const st=cloudSt();if(st.dirty&&cloudSess()&&!_cBusy){clearTimeout(_cTimer);cloudPush()}}});

/* ================= SHEET + INIT ================= */
function openSheet(html){document.getElementById('sheetIn').innerHTML=html;
  document.getElementById('sheet').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
migrate();          // runs here, not at declaration time — every helper it needs exists by now
let _seen=false; try{_seen=localStorage.getItem('pb_khata_seen')==='1'}catch(e){}
if(!_seen){
  try{localStorage.setItem('pb_khata_seen','1')}catch(e){}
  go('home');setTimeout(()=>{if(cloudCfg().url&&localIsEmpty())cloudSheet('Pehle se cloud backup hai? Login karke "Cloud wala lao" chuno. Naye ho to account banao.');else{openSettings();toast('👋 Set your opening balances first')}},400);
}else go('home');
handleShared();
cloudPaint();handleAuthHash().then(x=>{if(!x)setTimeout(()=>{try{cloudCheck()}catch(e){}},1500)}).catch(()=>{});
